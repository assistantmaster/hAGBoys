<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map</title>
    <style>
        .mapdiv {
            width: 100%;
            display: flex;
            justify-content: center;
            position: absolute;
            top: 0px;
            left: 0px;
        }
        .map {
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <p>
        🟠 - Wasser Refill <br>
        🔵 - Kühle Orte
    </p>
    <div class="mapdiv"><img src="./images/map.png" class="map"></div>
    
</body>
</html>
